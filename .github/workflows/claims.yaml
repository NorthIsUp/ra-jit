# The claims of docs/results.md that no job of ra-jit.yaml runs: rustc's own `tests/ui`
# run-pass tests give the same output built by ra-jit, and the scoreboard of real crates does
# not lose coverage. A pull request runs a slice of tests/ui; the nightly and a manual run
# take all of it (about 3800 programs, both backends).
name: claims
on:
  push:
    branches: ["main"]
    paths: ["harness/**", "crates/**", "Cargo.lock", ".github/workflows/claims.yaml"]
  pull_request:
    paths: ["harness/**", "crates/**", "Cargo.lock", ".github/workflows/claims.yaml"]
  schedule:
    - cron: "30 4 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "tests/ui programs to run (empty means all)"
        required: false

concurrency:
  group: claims-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  LLVM_SYS_201_PREFIX: /usr/lib/llvm-20

jobs:
  tests-ui:
    name: rustc tests/ui run-pass (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        backend: [cranelift, llvm]
    env:
      RA_JIT_BACKEND: ${{ matrix.backend }}
      RA_JIT_OPT: 2
      RA_JIT_EMIT: fast
      EVENT: ${{ github.event_name }}
      INPUT_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - run: rustup toolchain install 1.99.0 --profile minimal -c rust-src && rustup default 1.99.0
      - name: LLVM 20
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y llvm-20-dev libpolly-20-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ra-jit --release --features llvm
      # The tests of the tag of the stable ra-jit is pinned to.
      - name: rust-lang/rust 1.99.0, tests only
        run: |
          git clone --depth 1 --branch 1.99.0 --filter=blob:none --sparse https://github.com/rust-lang/rust "$RUNNER_TEMP/rust"
          git -C "$RUNNER_TEMP/rust" sparse-checkout set tests/ui tests/auxiliary
      - name: tests/ui
        working-directory: harness
        run: |
          export RA_JIT_BIN="$GITHUB_WORKSPACE/target/release/ra-jit"
          # Whole suite on a schedule or by hand, a slice on a pull request or a push.
          case "$EVENT" in schedule|workflow_dispatch) LIMIT="$INPUT_LIMIT";; *) LIMIT=150;; esac
          python3 uitest.py "$RUNNER_TEMP/rust" ${LIMIT:+--limit "$LIMIT"} --jobs 4 --work "$RUNNER_TEMP/ui" --json "$RUNNER_TEMP/ui.json" || status=$?
          python3 uigate.py "$RUNNER_TEMP/ui.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  scoreboard:
    name: scoreboard (real crates, both backends)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - run: rustup toolchain install 1.99.0 --profile minimal -c rust-src && rustup default 1.99.0
      - name: LLVM 20
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y llvm-20-dev libpolly-20-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ra-jit --release --features llvm
      - name: scoreboard
        working-directory: harness
        run: RA_JIT_BIN="$GITHUB_WORKSPACE/target/release/ra-jit" python3 scoreboard.py
