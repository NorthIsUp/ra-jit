# What is new since the fork: the flake (per-unit nix builds of the daemon and the demo), the
# unit graphs behind them, the Game of Life demo, and live edits (ra-jit-live).
#
#   unit graphs   nix/units/*.json are what `nix/unit_graph.py` generates from Cargo.lock now
#   nix           `nix build` of the daemon, the demo and the per-unit builds, and the flake's apps
#   nix (darwin)  the flake evaluates and builds its cheapest outputs on aarch64-darwin
#   demo          demo/life builds and its window opens (xvfb) and stays up
#   live edits    macOS arm64: edit a running program's function, ra-jit-live applies the patch
name: nix and live
on:
  push:
    branches: ["main"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "demo/**"
      - "harness/live/**"
      - "harness/live_e2e.py"
      - ".gitmodules"
      - "vendor/**"
      - ".github/workflows/nix-live.yaml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "demo/**"
      - "harness/live/**"
      - "harness/live_e2e.py"
      - ".gitmodules"
      - "vendor/**"
      - ".github/workflows/nix-live.yaml"
  workflow_dispatch:

concurrency:
  group: nix-live-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  unit-graphs:
    name: nix unit graphs are current
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - run: rustup toolchain install 1.99.0 --profile minimal -c rust-src && rustup default 1.99.0
      - run: rustup target add aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin
      - run: python3 nix/unit_graph.py
      - name: nix/units is what unit_graph.py writes
        run: |
          git diff --stat -- nix/units
          git diff --exit-code -- nix/units || { echo "::error::nix/units is stale: run nix/unit_graph.py and commit the result"; exit 1; }

  nix:
    name: nix build (x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: flake evaluates
        run: nix flake check --print-build-logs
      # The daemon as a package, the demo as a package, and the per-unit builds both are made of.
      - name: nix build
        run: nix build --print-build-logs --no-link .#daemon .#run .#life .#daemon-units .#life-bin
      - name: nix run .#ra-jit
        run: |
          nix run .#ra-jit -- --help
          nix run .#ra-jit -- --version || true
      - name: the three binaries run each other from next to themselves
        run: |
          out=$(nix build --no-link --print-out-paths .#daemon-units)
          for bin in ra-jit cargo-ra-jit ra-jit-rustc; do test -x "$out/bin/$bin"; done

  nix-darwin:
    name: nix build (aarch64-darwin)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: outputs evaluate
        run: |
          for attr in daemon run life daemon-units life-bin; do
            nix eval --raw ".#packages.aarch64-darwin.$attr.drvPath"; echo
          done
      - name: nix build (the daemon, per cargo unit)
        run: nix build --print-build-logs --no-link .#daemon-units .#run

  demo:
    name: demo/life and ra-jit-live (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - run: rustup toolchain install 1.99.0 --profile minimal -c rust-src && rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            demo/life -> target
      # ra-jit-live is a stub where live edits are not supported, and says so.
      - run: cargo test --release -p ra-jit-live
      - run: cargo build --locked
        working-directory: demo/life
      - name: window opens and stays up
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libwayland-client0
          export LIBGL_ALWAYS_SOFTWARE=1 RUST_BACKTRACE=1
          status=0
          timeout 15 xvfb-run -a --server-args="-screen 0 1280x800x24" demo/life/target/debug/life > life.log 2>&1 || status=$?
          cat life.log
          # timeout's own 124: the window was still up when it was stopped.
          test "$status" = 124 || { echo "::error::the window exited ($status) before it was stopped"; exit 1; }
          ! grep -E -i "panicked|Err\(" life.log

  live-edits:
    name: live edits (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    # Not required: it runs a daemon, a program and a patch between them on a hosted macOS VM,
    # which has been the least steady thing in the repository. Whatever it says is still shown.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - run: rustup toolchain install 1.99.0 --profile minimal -c rust-src && rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2
      # Where it is real code: the whole of macos.rs and the patch format.
      - run: cargo test --release -p ra-jit-live
      - run: cargo build --release -p ra-jit
      - name: edit a running program
        run: RA_JIT_BIN="$GITHUB_WORKSPACE/target/release/ra-jit" python3 harness/live_e2e.py
      - name: the demo builds on macOS
        run: cargo build --locked
        working-directory: demo/life
