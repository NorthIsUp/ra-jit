name: site

# Builds `site/` (SvelteKit, static) and deploys it to Cloudflare Workers from `main`.
# A pull request builds only. Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "README.md"
      - "docs/demo*"
      - ".github/workflows/site.yaml"
  pull_request:
    paths:
      - "site/**"
      - "README.md"
      - "docs/demo*"
      - ".github/workflows/site.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Without the token there is nothing to deploy with: the build above is still checked, and
      # the run says what is missing instead of failing every push that touches the site.
      - name: Deploy credentials
        id: credentials
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::warning::site not deployed: the secret CLOUDFLARE_API_TOKEN is not set in indexable-inc/ra-jit's Actions secrets"
      - name: Deploy
        if: steps.credentials.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
