[package]
name = "ra-jit"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
ra_ap_hir = "=0.0.358"
ra_ap_hir_ty = "=0.0.358"
ra_ap_hir_def = "=0.0.358"
ra_ap_ide = "=0.0.358"
ra_ap_ide_db = "=0.0.358"
ra_ap_base_db = "=0.0.358"
ra_ap_load-cargo = "=0.0.358"
ra_ap_project_model = "=0.0.358"
ra_ap_paths = "=0.0.358"
triomphe = "0.1"
ra_ap_vfs = "=0.0.358"
cranelift-codegen = "0.136"
cranelift-frontend = "0.136"
cranelift-jit = "0.136"
cranelift-module = "0.136"
cranelift-native = "0.136"
anyhow = "1"
either = "1.15"
ra-ap-rustc_type_ir = "=0.166.0"
ra-ap-rustc_abi = "=0.166.0"

eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }

[profile.release]
debug = 1

[patch.crates-io]
# One-line patch: make mir::Operand::kind pub (no public accessor upstream). See vendor.sh.
ra_ap_hir_ty = { path = "vendor/ra_ap_hir_ty" }
